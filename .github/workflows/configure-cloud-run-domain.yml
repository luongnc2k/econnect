name: Configure Cloud Run Domain

on:
  workflow_dispatch:

env:
  PROJECT_ID: econnect-prod
  REGION: asia-southeast1
  SERVICE: econnect-server
  DOMAIN: api.econnect.vn

jobs:
  configure-domain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Configure domain mapping
        run: |
          set -euo pipefail

          if gcloud beta run domain-mappings describe \
            --domain "$DOMAIN" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed >/tmp/domain-mapping.json 2>/tmp/domain-mapping.err; then
            echo "Domain mapping already exists for $DOMAIN."
          else
            cat /tmp/domain-mapping.err
            gcloud beta run domain-mappings create \
              --project "$PROJECT_ID" \
              --service "$SERVICE" \
              --domain "$DOMAIN" \
              --region "$REGION" \
              --platform managed
          fi

      - name: Print required DNS records
        run: |
          gcloud beta run domain-mappings describe \
            --domain "$DOMAIN" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --format="yaml(status.conditions,status.resourceRecords)"
