name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'

env:
  PROJECT_ID: econnect-prod
  REGION: asia-southeast1
  SERVICE: econnect-server
  IMAGE: asia-southeast1-docker.pkg.dev/econnect-prod/econnect/server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate backend startup imports
        env:
          DATABASE_URL: sqlite:///./server/.deploy-import-check.db
          APP_ENV: development
          STRICT_STARTUP_VALIDATION: false
          AUTO_INIT_SCHEMA: false
          INTERNAL_JOB_RUNNER_ENABLED: false
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          python -m compileall -q server
          python scripts/check_backend_imports.py

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Build and push
        run: |
          docker build -t $IMAGE:$GITHUB_SHA ./server
          docker push $IMAGE:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --service-account econnect-server@$PROJECT_ID.iam.gserviceaccount.com \
            --add-cloudsql-instances $PROJECT_ID:$REGION:econnect-db \
            --update-env-vars="^##^APP_ENV=production##STRICT_STARTUP_VALIDATION=false##GCS_FORCE_REMOTE=true##GCS_PROJECT=$PROJECT_ID##SERVER_PUBLIC_URL=https://api.econnect.vn##PAYMENT_PUBLIC_BASE_URL=https://api.econnect.vn##PAYMENT_GATEWAY_MODE=live##PAYOS_MOCK_MODE=false##PAYOS_PAYOUT_MOCK_MODE=false##GOOGLE_OAUTH_CLIENT_IDS=494116766002-vmqqd3gqo4sjeh2vqs9asebll9siu0ub.apps.googleusercontent.com,494116766002-lsmgsj8plfcneq5lpcccus645itgisps.apps.googleusercontent.com" \
            --update-secrets="JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,ADMIN_CREATE_SECRET=ADMIN_CREATE_SECRET:latest,PAYOS_CLIENT_ID=PAYOS_CLIENT_ID:latest,PAYOS_API_KEY=PAYOS_API_KEY:latest,PAYOS_CHECKSUM_KEY=PAYOS_CHECKSUM_KEY:latest,PAYOS_PAYOUT_CLIENT_ID=PAYOS_PAYOUT_CLIENT_ID:latest,PAYOS_PAYOUT_API_KEY=PAYOS_PAYOUT_API_KEY:latest,PAYOS_PAYOUT_CHECKSUM_KEY=PAYOS_PAYOUT_CHECKSUM_KEY:latest,PAYOS_PAYOUT_PARTNER_CODE=PAYOS_PAYOUT_PARTNER_CODE:latest" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10
